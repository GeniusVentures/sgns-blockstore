name: sgns-blockstore CI

# Test execution home for sgns-blockstore (user decision 2026-10-28): the
# thirdparty superbuild workflow still COMPILES the test binaries on every
# platform leg (compile coverage), but running them there proved too heavy -
# one wedged test held four Linux legs ~4h. This CI builds the repo against
# a thirdparty release artifact - exactly how SuperGenius consumes it - via
# the cmaketemplate build/ submodule (GeniusSDK pattern), and runs the
# hermetic Tier-1 lane with a hard per-test timeout so a hang can never
# wedge a runner again.
#
# Runners: strictly the org self-hosted fleet (user directive 2026-10-28) -
# sg-ubuntu-linux (EL8 container), SG-WIN11, gv-OSX-Large. The Windows
# self-hosted specifics mirror thirdparty build.yml / SuperGenius cmake.yml:
# Git Bash must be put on PATH BEFORE any `shell: bash` step (SG-WIN11 has
# a broken WSL whose bash.exe in System32 otherwise hijacks every bash step
# - run 40747127308), and parallelism is capped (the box pages with 24 cl
# instances).
#
# Requires org-scoped secret GNUS_TOKEN_1 (PAT reading GeniusVentures
# thirdparty/cmaketemplate releases + repos) - the job GITHUB_TOKEN cannot
# download cross-repo release assets or private submodules.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      thirdparty_tag:
        description: "thirdparty release tag to consume"
        type: string
        default: "test_coldstorage"
      build_type:
        description: "CMake build type"
        type: choice
        default: "Release"
        options: [Release, Debug]

permissions:
  contents: read

jobs:
  build-and-test:
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            platform: Linux
            id: Linux-x86_64
            abi: x86_64
            runs-on: >-
              ["self-hosted", "sg-ubuntu-linux"]
            container: ghcr.io/geniusventures/almalinux-8:latest
          - os: windows
            platform: Windows
            id: Windows
            abi: ""
            runs-on: >-
              ["self-hosted", "SG-WIN11"]
          - os: macos
            platform: OSX
            id: OSX
            abi: ""
            runs-on: >-
              ["self-hosted", "gv-OSX-Large"]

    runs-on: ${{ fromJson(matrix.runs-on) }}
    container: ${{ matrix.container }}

    env:
      GH_TOKEN: ${{ secrets.GNUS_TOKEN_1 }}
      THIRDPARTY_TAG: ${{ inputs.thirdparty_tag || 'test_coldstorage' }}
      BUILD_TYPE: ${{ inputs.build_type || 'Release' }}

    defaults:
      run:
        shell: bash

    steps:
      # MUST precede every bash step on the SG-WIN11 box (thirdparty
      # build.yml pattern): only Git\bin (bash.exe) - NOT Git\usr\bin, whose
      # trimmed MSYS2 perl shadows Strawberry Perl on that host. Explicit
      # pwsh: the job-wide bash default would hit the very WSL hijack this
      # step exists to prevent.
      - name: Configure bash on Windows (use Git Bash, not WSL)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $gitBinPath = "C:\Program Files\Git\bin"
          if (Test-Path $gitBinPath) {
            Add-Content -Path $env:GITHUB_PATH -Value $gitBinPath
            $env:PATH = "$gitBinPath;$env:PATH"
          }
          $bash = (Get-Command bash.exe -ErrorAction SilentlyContinue).Source
          Write-Output $(if ($bash) { "Bash location: $bash" } else { "WARNING: bash.exe not found in PATH" })

      - name: Clean workspace (self-hosted runners)
        working-directory: ${{ runner.workspace }}
        run: |
          # Container jobs leave root-owned files behind on Linux; Windows
          # keeps stale build trees. Drop only what this workflow owns.
          SUDO=$([ "$(uname)" = Linux ] && echo sudo || echo)
          $SUDO rm -rf sgns-blockstore thirdparty || true
          ls -la

      - name: Checkout sgns-blockstore (with cmaketemplate build submodule)
        uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: true

      - name: Download thirdparty release
        run: |
          set -euo pipefail
          FILE_NAME="${{ matrix.id }}-${BUILD_TYPE}.tar.gz"
          echo "asset: $FILE_NAME from tag $THIRDPARTY_TAG"
          mkdir thirdparty && cd thirdparty
          gh release download "$THIRDPARTY_TAG" --repo GeniusVentures/thirdparty -p "$FILE_NAME"
          tar -zxf "$FILE_NAME"
          ls "build/${{ matrix.platform }}"

      - name: Configure Linux host
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          # Match the toolchain the thirdparty artifact was built with: the
          # AlmaLinux 8 CI image ships clang; EL8's default g++ 8.5 cannot
          # compile this tree.
          sudo update-alternatives --install /usr/bin/cc cc "$(which clang)" 100
          sudo update-alternatives --install /usr/bin/c++ c++ "$(which clang++)" 100
          sudo update-alternatives --set cc "$(which clang)"
          sudo update-alternatives --set c++ "$(which clang++)"
          echo "CMAKE_GENERATOR=Ninja" >> "$GITHUB_ENV"

      - name: Configure macOS host
        if: runner.os == 'macOS'
        run: |
          brew install ninja gnu-tar || true
          if [ -d "/opt/homebrew/opt/gnu-tar/libexec/gnubin" ]; then
            echo "PATH=/opt/homebrew/opt/gnu-tar/libexec/gnubin:$PATH" >> "$GITHUB_ENV"
          fi
          echo "CMAKE_GENERATOR=Ninja" >> "$GITHUB_ENV"

      # Windows: the VS generator discovers the MSVC toolchain itself (same
      # posture as the thirdparty superbuild's own Windows leg on this box);
      # no vcvars/Ninja export needed. Cap compiler concurrency - the bare
      # -j below honours this env cap (SG-WIN11 pages with 24 cl instances,
      # observed 2026-09).
      - name: Configure Windows host
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-Content -Path $env:GITHUB_ENV -Value "CMAKE_BUILD_PARALLEL_LEVEL=8"

      # cmaketemplate entry (GeniusSDK pattern). THIRDPARTY_DIR is set
      # EXPLICITLY so CommonCompilerOptions.cmake's thirdparty guard sees the
      # extracted artifact (its own check looks at
      # ${THIRDPARTY_DIR}/../thirdparty/build/...); without it the template
      # falls into its self-download branch (develop-tag URL) and dies
      # extracting a 404 page - the macOS failure of run 40747127308.
      # cmake/CommonBuildParameters.cmake resolves the full dependency
      # closure from the artifact tree.
      - name: Configure sgns-blockstore
        run: |
          set -euo pipefail
          GENERATOR_ARGS=()
          if [ "${{ matrix.platform }}" != "Windows" ]; then
            GENERATOR_ARGS=(-G Ninja)
          fi
          TP="$GITHUB_WORKSPACE/thirdparty"
          if [ "${{ matrix.platform }}" = "Windows" ]; then
            # CMake on Windows needs a native path, not the MSYS one.
            TP="$(cd thirdparty && pwd -W)"
          fi
          cmake -S "build/${{ matrix.platform }}" -B build \
            -DCMAKE_BUILD_TYPE="$BUILD_TYPE" \
            -DTESTING=ON \
            -DTHIRDPARTY_DIR="$TP" \
            -DTHIRDPARTY_BUILD_DIR="$TP/build/${{ matrix.platform }}/${BUILD_TYPE}" \
            "${GENERATOR_ARGS[@]}"

      - name: Build
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: 8
        run: cmake --build build --config "$BUILD_TYPE" -j

      # out_of_tree_consumer_proof consumes the install tree; the template
      # installs into <build>/sgns-blockstore automatically.
      - name: Install
        run: cmake --install build --config "$BUILD_TYPE"

      # -L Tier1 fails closed (ctest -L never includes an unlabeled test) and
      # --no-tests=error fails an empty selection, so a label typo cannot pass
      # vacuously. --timeout 300 is the anti-wedge guard: a hung test fails
      # in 5 minutes instead of holding the runner for hours.
      - name: Run Tier-1 tests
        run: ctest --test-dir build -C "$BUILD_TYPE" -L Tier1 --output-on-failure --no-tests=error --timeout 300
